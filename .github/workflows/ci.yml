name: Integration & Unit test

on:
  pull_request:
    branches:
      - MOODLE_*_STABLE

jobs:
  PHPUnit:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        experimental: [ false ]
        php: [ '8.3', '8.4' ]
        moodle: [ MOODLE_500_STABLE, MOODLE_501_STABLE, MOODLE_502_STABLE ]
        dbtype: [ mysqli, sqlsrv ]
        include:
          - os: ubuntu-latest
            experimental: false
            php: '8.2'
            moodle: MOODLE_500_STABLE
            dbtype: mysqli
            dependencies: |
              praxisdigital/local_mxaimanager@MOODLE_50_STABLE
          - os: ubuntu-latest
            experimental: false
            php: '8.2'
            moodle: MOODLE_500_STABLE
            dbtype: sqlsrv
            dependencies: |
              praxisdigital/local_mxaimanager@MOODLE_50_STABLE
          - os: ubuntu-latest
            experimental: false
            php: '8.2'
            moodle: MOODLE_501_STABLE
            dbtype: mysqli
            dependencies: |
              praxisdigital/local_mxaimanager@MOODLE_50_STABLE
          - os: ubuntu-latest
            experimental: false
            php: '8.2'
            moodle: MOODLE_501_STABLE
            dbtype: sqlsrv
            dependencies: |
              praxisdigital/local_mxaimanager@MOODLE_50_STABLE

    steps:
      - name: Unit testing & integration testing
        uses: praxisdigital/moodle-test-action@master
        with:
          plugin: assignsubmission_pxaiwriter
          plugin-path: mod/assign/submission/pxaiwriter
          os: ${{ matrix.os }}
          php: ${{ matrix.php }}
          dbtype: ${{ matrix.dbtype }}
          moodle: ${{ matrix.moodle }}
          experimental: ${{ matrix.experimental }}
          dependencies: ${{ matrix.dependencies }}
          PRIVATE_REPO_TOKEN: ${{ secrets.MOODLE_GH_KEY }}